[project]
name = "plangate"
version = "0.1.0"
description = "Infrastructure plan review and human approval gate"
readme = "README.md"
authors = [
    { name = "Igor", email = "igor@zilberman.ca" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx2>=2.13.1",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
    "temporalio>=1.34.0",
]

[project.scripts]
plangate = "plangate.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
