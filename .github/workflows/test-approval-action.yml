name: Check approval action

on:
  pull_request:
  workflow_dispatch:

env:
  API_URL: http://127.0.0.1:8000

jobs:
  approval-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start docker compose
        run: docker compose up --build --wait

      - name: Wait for API
        run: |
          curl --fail --silent --show-error \
          --retry 10 \
          --retry-delay 2 \
          --retry-all-errors \
          --connect-timeout 2 \
          --max-time 5 \
          --output /dev/null \
          "$API_URL/openapi.json"

      - name: Create a review
        id: review
        uses: ./.github/actions/submit-plan
        with:
          api_url: ${{ env.API_URL }}
          plan_path: tests/fixtures/plans/nginx-create.json


      - name: Check pending review
        id: pending_check
        continue-on-error: true
        uses: ./.github/actions/check-approval
        with:
          api_url: ${{ env.API_URL }}
          review_id: ${{ steps.review.outputs.review_id }}

      - name: Assert pending review is denied
        env:
          OUTCOME: ${{ steps.pending_check.outcome }}
        run: test "$OUTCOME" = "failure"

      - name: Approve review
        env:
          REVIEW_ID: ${{ steps.review.outputs.review_id }}
        shell: bash
        run: |
          curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              --data '{"status":"approved","reviewer":"integration-test","reason":"Simulated approval for CI integration test"}' \
              "$API_URL/reviews/$REVIEW_ID/approval"

      - name: Wait for approval persistence
        env:
          REVIEW_ID: ${{ steps.review.outputs.review_id }}
        shell: bash
        run: |
          for attempt in {1..15}; do
            response=$(curl --fail --silent --show-error --max-time 5 \
              "$API_URL/reviews/$REVIEW_ID")

            if printf '%s' "$response" | jq -e '.approval_status == "approved"' > /dev/null; then
              exit 0
            fi

            sleep 2
          done

          echo "Approval was not persisted in time"
          exit 1

      - name: Can deploy
        uses: ./.github/actions/check-approval
        with:
          api_url: ${{ env.API_URL }}
          review_id: ${{ steps.review.outputs.review_id }}
