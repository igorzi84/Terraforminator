name: Plan review integration

on:
  pull_request:
  workflow_dispatch:

env:
  API_URL: http://127.0.0.1:8000

jobs:
  plan-review-integration:
    name: Plan review — ${{ matrix.case }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: safe-approved
            plan_path: tests/fixtures/plans/nginx-create.json
            human_decision: approved
            expected_outcome: success
          - case: blocked-approved
            plan_path: tests/fixtures/plans/aws_sg_update.json
            human_decision: approved
            expected_outcome: failure
          - case: safe-rejected
            plan_path: tests/fixtures/plans/nginx-create.json
            human_decision: rejected
            expected_outcome: failure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start docker compose
        run: docker compose up --build --wait

      - name: Wait for API
        run: |
          curl --fail --silent --show-error \
          --retry 10 \
          --retry-delay 2 \
          --retry-all-errors \
          --connect-timeout 2 \
          --max-time 5 \
          --output /dev/null \
          "$API_URL/openapi.json"

      - name: Create a review
        id: review
        uses: ./.github/actions/submit-plan
        with:
          api_url: ${{ env.API_URL }}
          plan_path: ${{ matrix.plan_path }}

      - name: Check pending review
        id: pending_check
        continue-on-error: true
        uses: ./.github/actions/check-approval
        with:
          api_url: ${{ env.API_URL }}
          review_id: ${{ steps.review.outputs.review_id }}

      - name: Assert pending review is denied
        env:
          OUTCOME: ${{ steps.pending_check.outcome }}
        run: test "$OUTCOME" = "failure"

      - name: Submit human decision
        env:
          REVIEW_ID: ${{ steps.review.outputs.review_id }}
          HUMAN_DECISION: ${{ matrix.human_decision }}
        shell: bash
        run: |
          jq -n --arg status "$HUMAN_DECISION" \
            '{status: $status, reviewer: "integration-test", reason: "Simulated CI decision"}' |
            curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              --data-binary @- \
              "$API_URL/reviews/$REVIEW_ID/approval"

      - name: Wait for approval persistence
        env:
          REVIEW_ID: ${{ steps.review.outputs.review_id }}
          HUMAN_DECISION: ${{ matrix.human_decision }}
        shell: bash
        run: |
          for attempt in {1..15}; do
            response=$(curl --fail --silent --show-error --max-time 5 \
              "$API_URL/reviews/$REVIEW_ID")

            if printf '%s' "$response" | jq -e --arg status "$HUMAN_DECISION" '.approval_status == $status' > /dev/null; then
              exit 0
            fi

            sleep 2
          done

          echo "Approval was not persisted in time"
          exit 1

      - name: Can deploy
        id: final_check
        continue-on-error: true
        uses: ./.github/actions/check-approval
        with:
          api_url: ${{ env.API_URL }}
          review_id: ${{ steps.review.outputs.review_id }}

      - name: Assert final gate outcome
        env:
          ACTUAL: ${{ steps.final_check.outcome }}
          EXPECTED: ${{ matrix.expected_outcome }}
        run: test "$ACTUAL" = "$EXPECTED"
