name: Tests

on: [pull_request]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Install python
              uses: actions/setup-python@v7
              with:
                  python-version-file: ".python-version"

            - name: Install uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
              with:
                  version: "0.13.1"

            - name: Sync uv
              run: uv sync --locked --dev

            - name: Run tests
              run: uv run pytest
