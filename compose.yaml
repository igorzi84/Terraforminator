services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - terraforminator-data:/data
  prometheus:
    image: prom/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
volumes:
  terraforminator-data:
  prometheus-data:
